<!doctype html>
<meta charset="utf-8">
<title>The Seventh Color &mdash; end card</title>
<style>
  /* The game's own title screen at 1080p. native/src/main.js draws
     `bloom(160, 110, t, 8, 3)` - seven rings, one per colour of the
     RAINBOW in scenes.js, at radius 8 + i*3 with each breathing on its own
     phase - and the gold word above them. Everything here is that, scaled
     by 1920/320, so the card and the game are the same picture. */
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;
    background:#0a0710;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}
  .rings{position:fixed;left:960px;top:838px}
  .r{position:absolute;border-radius:50%;border-style:solid;border-width:12px;
     transform:translate(-50%,-50%);opacity:.92}
  /* The game wobbles each ring by sin(t*1.5 + i)*1.5 of a 320-wide canvas -
     nine pixels here, and the phase offset per ring is what makes the stack
     breathe instead of pulse. */
  @keyframes br{0%{transform:translate(-50%,-50%) scale(1)}
                50%{transform:translate(-50%,-50%) scale(var(--s))}
                100%{transform:translate(-50%,-50%) scale(1)}}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:flex-start;padding-top:126px;z-index:2;text-align:center}
  /* Gold on near-black, bold system-ui: the game's own title, at the game's
     own weight. */
  .title{font-weight:700;font-size:96px;color:#e8b923;letter-spacing:.5px;
         text-shadow:0 0 60px rgba(232,185,35,.28)}
  .l1{margin-top:44px;font-size:42px;color:#cdbfa0;opacity:0;animation:up .5s ease-out .55s forwards}
  .js13k{margin-top:74px;font-size:54px;font-weight:700;color:#f3ead6;opacity:0;
         animation:up .5s ease-out 1.1s forwards}
  .sub{margin-top:16px;font-size:36px;color:#7cb56a;opacity:0;animation:up .5s ease-out 1.3s forwards}
  .byline{margin-top:52px;font-size:36px;color:#8a7f6a;opacity:0;animation:up .5s ease-out 1.55s forwards}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  /* The seventh colour itself, the one the story is about: it arrives last
     and it is the only thing on the card that is not already in the game. */
  .seed{position:fixed;left:960px;top:838px;width:30px;height:30px;margin:-15px 0 0 -15px;
        border-radius:50%;background:#fff6d8;box-shadow:0 0 90px 30px rgba(255,246,216,.30);
        animation:seed 3.4s ease-in-out infinite}
  @keyframes seed{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
</style>
<div class="rings">
  <div class="r" style="width:96px;height:96px;border-color:#c9524f;--s:1.20;animation:br 3.4s ease-in-out 0s infinite"></div>
  <div class="r" style="width:132px;height:132px;border-color:#d98a4a;--s:1.15;animation:br 3.4s ease-in-out -.45s infinite"></div>
  <div class="r" style="width:168px;height:168px;border-color:#d9c14f;--s:1.12;animation:br 3.4s ease-in-out -.90s infinite"></div>
  <div class="r" style="width:204px;height:204px;border-color:#7cb56a;--s:1.10;animation:br 3.4s ease-in-out -1.35s infinite"></div>
  <div class="r" style="width:240px;height:240px;border-color:#5a9bb0;--s:1.08;animation:br 3.4s ease-in-out -1.80s infinite"></div>
  <div class="r" style="width:276px;height:276px;border-color:#6b7ec9;--s:1.07;animation:br 3.4s ease-in-out -2.25s infinite"></div>
  <div class="r" style="width:312px;height:312px;border-color:#9a6bc4;--s:1.06;animation:br 3.4s ease-in-out -2.70s infinite"></div>
</div>
<div class="seed"></div>
<div class="wrap">
  <div class="title">THE SEVENTH COLOR</div>
  <div class="l1">six colours the world was allowed to keep</div>
  <div class="js13k">js13kGames 2026</div>
  <div class="sub">a story game in 13 kilobytes &mdash; plays in your browser</div>
  <div class="byline">@gtanczyk&nbsp;|&nbsp;gamedev.pl&nbsp;|&nbsp;2026</div>
</div>
