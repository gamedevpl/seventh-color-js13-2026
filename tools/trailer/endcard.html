<!doctype html>

<style>

    font-family:'Arial Black',Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
  .title{font-size:110px;font-weight:900;color:#fff6dd;letter-spacing:6px;opacity:0;
    text-shadow:0 4px 22px rgba(0,0,0,.55);
    transform:translateY(14px);animation:up .6s ease-out .15s forwards}
  .bar{width:620px;height:18px;margin-top:34px;border-radius:3px;opacity:0;

  .js13k{margin-top:46px;font-size:34px;font-weight:900;color:#f5cc57;letter-spacing:1px;

  .sub{margin-top:10px;font-size:22px;font-weight:400;color:#f0dcae;font-family:Arial,sans-serif;
    opacity:0;animation:up .5s ease-out 1.45s forwards}
  .byline{margin-top:44px;font-size:18px;font-weight:400;color:#b89a6a;letter-spacing:1px;
    font-family:Arial,sans-serif;opacity:0;animation:up .5s ease-out 1.7s forwards}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
</style>
