name: size

# push is deliberately NOT a trigger here. It was, until every single run on
# every push failed the same way: the games-repo checkout below needs
# GAMES_REPO_TOKEN (read access to the private games repo) and that secret
# was never added to this repo's settings, so the job dies at "Input required
# and not supplied: token" before it builds anything. That's a repo-settings
# gap, not something a workflow fix can paper over - add the secret
# (Settings -> Secrets and variables -> Actions -> GAMES_REPO_TOKEN, a token
# with read access to gamedevpl/www.gamedev.pl-games) and restore
# `push: {branches: [main]}` alongside workflow_dispatch below once it's set.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Games-repo branch to pack (defaults to config.json's source.branch)
        required: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The branch to pack is config.json's source of truth (`source.branch`),
      # not a hardcoded default here - one drifting out of sync with the other
      # is exactly how this workflow spent a whole session failing every push,
      # checking out a branch (codex/seventh-color-cast-prototype) that had
      # since been renamed away and no longer existed at all. A manual dispatch
      # can still override it for a one-off trial.
      - name: Resolve games-repo branch
        id: branch
        run: echo "ref=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
        if: github.event.inputs.branch != ''
      - name: Resolve games-repo branch from config.json
        id: branch-config
        run: echo "ref=$(node -pe "require('./config.json').source.branch")" >> "$GITHUB_OUTPUT"
        if: github.event.inputs.branch == ''

      # The games repo is private, so this needs a token with read access to it.
      # Add it as the GAMES_REPO_TOKEN secret; without it the checkout fails and
      # the job says so rather than packing something stale.
      - uses: actions/checkout@v4
        with:
          repository: gamedevpl/www.gamedev.pl-games
          ref: ${{ steps.branch.outputs.ref || steps.branch-config.outputs.ref }}
          token: ${{ secrets.GAMES_REPO_TOKEN }}
          path: games-repo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: games-repo

      # playwright-core ships no downloader; borrow the matching full package's.
      - run: npx --yes playwright@1.56.1 install --with-deps chromium

      - run: node tools/pull.mjs --games ./games-repo
      - run: node tools/pack.mjs
      - run: node tools/verify.mjs

      - name: Publish the ledger
        run: cat SIZE.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: seventh-color-js13
          path: |
            build/index.zip
            build/verify.png
            SIZE.md
