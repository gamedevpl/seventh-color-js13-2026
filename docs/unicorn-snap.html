<style>

     things. Every colour is painted explicitly so nothing is inherited

  :root { --surround: #171008; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--surround);
    overflow: hidden;
    overscroll-behavior: none;

     around does nothing at all. */

    touch-action: none;
    background: var(--surround);
  }
  button:focus-visible {
    outline: 2px solid #f2d98a;
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
  }
