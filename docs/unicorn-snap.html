    overscroll-behavior: none;

    background: var(--surround);
  }
  button:focus-visible {
    outline: 2px solid #f2d98a;
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
  }
