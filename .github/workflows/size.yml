name: size

# Both entries are native now (NATIVE.md, RAINBOW-SURFER.md): they build from
# this repo alone, so the games-repo checkout - and the GAMES_REPO_TOKEN
# secret it needed, which was never added and failed every run at "Input
# required and not supplied: token" - is gone from CI entirely. The legacy
# packer pipeline (tools/pull.mjs + pack.mjs, `npm run size`) still exists
# for local archaeology but no longer gates anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      # playwright-core ships no downloader; borrow the matching full
      # package's. Keep the version in step with package.json's
      # playwright-core pin.
      - run: npx --yes playwright@1.56.1 install --with-deps chromium

      # Each build enforces its own milestone ceiling (native-milestone.json /
      # strands-milestone.json), so an over-budget entry fails right here.
      # --O1 matches the release gates - the plain default packs looser and
      # trips the ceiling on bytes an actual submission would never carry.
      # One roll per entry: CI answers "does it build, fit and play", the
      # worst-of-5 ratchet stays a local release-gate concern.
      - name: Build The Seventh Color
        run: npm run native -- --O1
      - name: Verify The Seventh Color
        run: npm run native:verify
      - name: Build Rainbow Surfer
        run: npm run strands -- --O1
      - name: Verify Rainbow Surfer
        run: npm run strands:verify

      - name: Publish the ledger
        run: |
          {
            echo "| entry | zipped | limit |"
            echo "| --- | ---: | ---: |"
            echo "| The Seventh Color | $(stat -c %s build/native/index.zip) | 13312 |"
            echo "| Rainbow Surfer | $(stat -c %s build/strands/index.zip) | 13312 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: seventh-color-js13
          path: |
            build/native/index.zip
            build/native/verify.png
            build/strands/index.zip
            build/strands/verify.png
