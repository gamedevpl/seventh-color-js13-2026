<style>

     commits to that in either host theme rather than trying to be two
     things. Every colour is painted explicitly so nothing is inherited
     from whatever ground the viewer's theme puts behind it. */
  :root { --surround: #171008; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--surround);
    overflow: hidden;
    overscroll-behavior: none;

     instead - which on a phone means the one control the game is built
     around does nothing at all. */
  canvas#c {
    display: block;
    touch-action: none;
    background: var(--surround);
  }
  button:focus-visible {
    outline: 2px solid #f2d98a;
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
  }
</style>
